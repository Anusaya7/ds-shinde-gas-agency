<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <defs>
    <linearGradient id="body5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4af37"/>
      <stop offset="50%" style="stop-color:#f0d96b"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
    <linearGradient id="ring5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b6914"/>
      <stop offset="50%" style="stop-color:#d4af37"/>
      <stop offset="100%" style="stop-color:#8b6914"/>
    </linearGradient>
  </defs>
  <!-- Protective cap -->
  <rect x="85" y="20" width="30" height="18" rx="4" fill="#2c3e50"/>
  <!-- Top ring collar -->
  <rect x="70" y="38" width="60" height="10" rx="2" fill="url(#ring5)"/>
  <!-- Cylinder body -->
  <rect x="60" y="48" width="80" height="120" rx="8" fill="url(#body5)" stroke="#8b6914" stroke-width="2"/>
  <!-- Body highlights -->
  <rect x="68" y="56" width="8" height="108" rx="4" fill="#fff9c4" opacity="0.4"/>
  <rect x="124" y="56" width="6" height="108" rx="3" fill="#5d4037" opacity="0.25"/>
  <!-- Middle band -->
  <rect x="60" y="110" width="80" height="14" fill="#8b6914" opacity="0.5"/>
  <!-- Bottom ring -->
  <rect x="60" y="168" width="80" height="12" rx="3" fill="url(#ring5)"/>
  <!-- Base foot -->
  <rect x="55" y="180" width="90" height="14" rx="4" fill="#3d2b1f"/>
  <!-- Handle guard -->
  <rect x="145" y="70" width="14" height="60" rx="5" fill="#5d4037"/>
  <rect x="152" y="62" width="28" height="14" rx="5" fill="#5d4037"/>
  <!-- Label area -->
  <rect x="70" y="80" width="60" height="40" rx="5" fill="#fff" opacity="0.9"/>
  <text x="100" y="100" font-family="Arial" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">5 KG</text>
  <text x="100" y="114" font-family="Arial" font-size="8" fill="#666" text-anchor="middle">LPG</text>
</svg>