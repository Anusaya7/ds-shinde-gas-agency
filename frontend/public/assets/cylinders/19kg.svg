<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 420" width="200" height="420">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8E1B1B"/>
      <stop offset="18%" stop-color="#C0392B"/>
      <stop offset="45%" stop-color="#D64545"/>
      <stop offset="68%" stop-color="#E8705F"/>
      <stop offset="86%" stop-color="#F1948A"/>
      <stop offset="100%" stop-color="#8E1B1B"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#641E16"/>
      <stop offset="50%" stop-color="#C0392B"/>
      <stop offset="100%" stop-color="#641E16"/>
    </linearGradient>
    <linearGradient id="valve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5D6D7E"/>
      <stop offset="50%" stop-color="#AEB6BF"/>
      <stop offset="100%" stop-color="#5D6D7E"/>
    </linearGradient>
    <radialGradient id="cap" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDFEFE"/>
      <stop offset="100%" stop-color="#BFC9CA"/>
    </radialGradient>
  </defs>

  <!-- Valve assembly -->
  <rect x="88.12" y="6" width="23.76" height="16" rx="4" fill="url(#valve)"/>
  <ellipse cx="100" cy="19" rx="15" ry="8" fill="url(#cap)" stroke="#444" stroke-width="1.4"/>
  <rect x="97.5" y="11" width="5" height="8" fill="#7F8C8D"/>

  <!-- Top ring -->
  <rect x="61.120000000000005" y="56" width="77.75999999999999" height="10" rx="6" fill="url(#ring)"/>

  <!-- Main cylinder body -->
  <rect x="46" y="62" width="108" height="331" rx="16" fill="url(#body)" stroke="#7B241C" stroke-width="2.4"/>

  <!-- Side highlights -->
  <rect x="54" y="78" width="8" height="295" rx="4" fill="#FFFFFF" opacity="0.28"/>
  <rect x="137" y="78" width="9" height="295" rx="4" fill="#8E1B1B" opacity="0.28"/>

  <!-- Gaspoint brand label -->
  <rect x="64" y="207" width="71" height="41" rx="8" fill="#FFFFFF" opacity="0.94" stroke="#7B241C" stroke-width="1.2"/>
  <text x="100" y="226" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#8E1B1B" text-anchor="middle">GASPOINT</text>
  <text x="100" y="241" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1C2833" text-anchor="middle">19.2 KG</text>
  <text x="100" y="252" font-family="Arial, Helvetica, sans-serif" font-size="7" fill="#566573" text-anchor="middle">COMMERCIAL CYLINDER</text>

  <!-- Bottom ring -->
  <rect x="61.120000000000005" y="387" width="77.75999999999999" height="10" rx="6" fill="url(#ring)"/>

  <!-- Base -->
  <rect x="42" y="397" width="117" height="12" rx="7" fill="#5D4037"/>
</svg>
