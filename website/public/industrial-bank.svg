<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Industrial LPG bank of 425 kg cylinders">
  <rect width="800" height="450" rx="24" fill="#f3f4f6"/>
  <rect x="60" y="330" width="680" height="14" rx="7" fill="#d1d5db"/>
  <rect x="70" y="90" width="660" height="244" rx="12" fill="#1A237E10" stroke="#1A237E" stroke-dasharray="8 6"/>
  <text x="400" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1A237E">Customized LPG Bank — 425 kg Cylinders</text>
  {[0,1,2,3,4,5].map((i) => (
    <g key={i} transform={`translate(${120 + i * 95}, 120)`}>
      <rect width="80" height="200" rx="36" fill={i % 2 ? "#D32F2F" : "#2E7D32"} />
      <rect x="22" y="-24" width="36" height="30" rx="6" fill={i % 2 ? "#b71c1c" : "#1b5e20"} />
      <circle cx="40" cy="-24" r="9" fill="#9ca3af" />
      <rect x="16" y="80" width="48" height="42" rx="5" fill="#ffffff" />
      <text x="40" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill={i % 2 ? "#D32F2F" : "#2E7D32"}>425</text>
    </g>
  ))}
  <rect x="600" y="300" width="120" height="26" rx="6" fill="#9ca3af"/>
  <text x="660" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1f2937">Manifold</text>
</svg>
