<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 800" width="320" height="800">
  <defs>
    <linearGradient id="body425" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0d47a1"/>
      <stop offset="30%" style="stop-color:#1e3a5f"/>
      <stop offset="60%" style="stop-color:#2c5282"/>
      <stop offset="100%" style="stop-color:#17365D"/>
    </linearGradient>
    <linearGradient id="band425" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8eaf6"/>
      <stop offset="50%" style="stop-color:#d6e0f0"/>
      <stop offset="100%" style="stop-color:#c5d8f2"/>
    </linearGradient>
    <linearGradient id="valve425" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a2845"/>
      <stop offset="50%" style="stop-color:#0d47a1"/>
