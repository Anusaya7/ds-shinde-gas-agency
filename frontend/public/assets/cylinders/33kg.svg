<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 500" width="240" height="500">
  <defs>
    <linearGradient id="body33" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7cb342"/>
      <stop offset="40%" style="stop-color:#8bc34a"/>
      <stop offset="70%" style="stop-color:#a5d6a7"/>
      <stop offset="100%" style="stop-color:#c8e6c9"/>
    </linearGradient>
    <linearGradient id="ring33" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2e7d32"/>
      <stop offset="50%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </gradient>
  </defs>
  <!-- Valve assembly -->
  <rect x="100" y="6" width="40" height="24" rx="5" fill="#2e7d32"/>
  <rect x="112" y="12" width="16" height="8" rx="3" fill="#fff"/>
  <circle cx="120" cy="26" r="5" fill="#1b5e20" stroke="#1a1a1a" stroke-width="0.5"/>
  <!-- Top ring -->
  <rect x="70" y="30" width="100" height="14" rx="4" fill="url(#ring33)"/>
  <!-- Main cylinder body -->
  <rect x="70" y="44" width="100" height="330" rx="16" fill="url(#body33)" stroke="#81c784" stroke-width="2"/>
  <!-- Side highlights -->
  <rect x="80" y="55" width="8" height="318" rx="4" fill="#fff" opacity="0.25"/>
  <rect x="152" y="55" width="10" height="318" rx="4" fill="#2e7d32" opacity="0.15"/>
  <!-- Bands -->
  <rect x="70" y="120" width="100" height="16" fill="#c8e6c9" opacity="0.6"/>
  <rect x="70" y="160" width="100" height="16" fill="#a5d6a7"/>
  <rect x="70" y="200" width="100" height="16" fill="#81c784"/>
  <rect x="70" y="240" width="100" height="16" fill="#a5d6a7"/>
  <rect x="70" y="280" width="100" height="16" fill="#c8e6c9" opacity="0.6"/>
  <!-- Label area -->
  <rect x="90" y="185" width="60" height="70" rx="8" fill="#fff" opacity="0.95"/>
  <text x="120" y="220" font-family="Arial" font-size="24" font-weight="bold" fill="#17365D" text-anchor="middle">33 KG</text>
  <text x="120" y="242" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">Commercial LPG</text>
  <!-- Bottom base -->
  <rect x="60" y="374" width="120" height="26" rx="8" fill="#2e7d32"/>
  <rect x="55" y="398" width="130" height="14" rx="6" fill="#1b5e20"/>
  <!-- Bottom ring -->
  <rect x="70" y="430" width="100" height="16" rx="6" fill="url(#ring33)"/>
  <!-- Serial number -->
  <text x="120" y="465" font-family="Arial" font-size="8" fill="#666" text-anchor="middle">S/N: DS-COMM-33</text>
</svg>