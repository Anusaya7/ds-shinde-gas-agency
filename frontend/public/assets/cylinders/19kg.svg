<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400">
  <defs>
    <linearGradient id="body19" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a7c957"/>
      <stop offset="30%" style="stop-color:#c0e590"/>
      <stop offset="50%" style="stop-color:#d7f2a4"/>
      <stop offset="70%" style="stop-color:#c6e2b7"/>
      <stop offset="100%" style="stop-color:#a8d5a6"/>
    </linearGradient>
    <linearGradient id="ring19" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3a5a2c"/>
      <stop offset="50%" style="stop-color:#6b8e3a"/>
      <stop offset="100%" style="stop-color:#3a5a2c"/>
    </linearGradient>
    <linearGradient id="valve19" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#1b3a12"/>
      <stop offset="100%" style="stop-color:#0d2509"/>
    </linearGradient>
  </defs>
  <!-- Valve assembly -->
  <rect x="70" y="12" width "60" height="20" rx="5" fill="url(valve19)"/>
  <rect x="90" y="14" width="20" height="8" rx="3" fill="#777"/>
  <circle cx="100" cy="26" r="6" fill="#0f3e08" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Top collar ring -->
  <rect x="55" y="32" width="90" height="12" rx="3" fill="url(#ring19)"/>
  <!-- Body -->
  <rect x="40" y="44" width="120" height="220" rx="14" fill="url(#body19)" stroke="#8bc34a" stroke-width="2"/>
  <!-- Highlights -->
  <rect x="50" y="55" width="100" height="70" rx="8" fill="#fff" opacity="0.2"/>
  <rect x="135" y="55" width="12" height="70" rx="5" fill="#555" opacity="0.12"/>
  <!-- Section bands -->
  <rect x="40" y="150" width="120" height="22" fill="#c8e6c9" opacity="0.5"/>
  <rect x="40" y="190" width="120" height="22" fill="#a5d6a7" opacity="0.5"/>
  <!-- Base plate -->
  <rect x="30" y="304" width="140" height="22" rx="6" fill="#388e3c"/>
  <rect x="25" y="320" width="150" height "14" rx="6" fill="#1b5e20"/>
  <!-- Label area -->
  <rect x="70" y="158" width "60" height="80" rx="8" fill="#fff" opacity="0.95"/>
  <text x="100" y="198" font-family="Arial" font-size="22" font-weight="bold" fill="#17365D" text-anchor="middle">19.2 KG</text>
  <text x="100" y="218" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">LARGE DOMESTIC</text>
  <text x="100" y="230" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">LPG CYLINDER</text>
  <!-- Bottom accent ring -->
  <rect x="40" y="360" width="120" height="16" rx="6" fill="url(#ring19)"/>
  <!-- External data badge -->
  <text x="100" y="382" font-family="Arial" font-size="8" fill="#555" text-anchor="middle">Verified Weight</text>
</svg>