<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 360" width="200" height="360">
  <defs>
    <linearGradient id="body15" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d7ccc8"/>
      <stop offset="40%" style="stop-color:#efebe9"/>
      <stop offset="70%" style="stop-color:#eceff1"/>
      <stop offset="100%" style="stop-color="#b0bec5"/>
    </linearGradient>
    <linearGradient id="ring15" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6d6d6d"/>
      <stop offset="50%" style="stop-color:#9e9e9e"/>
      <stop offset="100%" style="stop-color:#6d6d6d"/>
    </linearGradient>
    <linearGradient id="valve15" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#424242"/>
      <stop offset="100%" style="stop-color:#212121"/>
    </linearGradient>
  </defs>
  <!-- Top valve housing -->
  <rect x="85" y="22" width="30" height="22" rx="6" fill="url(valve15)"/>
  <rect x="80" y="16" width="40" height "8" rx="3" fill="#777"/>
  <!-- Middle ring -->
  <rect x="60" y="70" width="80" height="20" rx="5" fill="url(#ring15)"/>
  <!-- Cylinder body -->
  <rect x="50" y="90" width="100" height="180" rx="12" fill="url(#body15)" stroke="#9e9e9e" stroke-width="1.5"/>
  <!-- Upper highlight -->
  <rect x="58" y="98" width="84" height="40" rx="6" fill="#fff" opacity="0.25"/>
  <!-- Lower highlight -->
  <rect x="62" y="158" width="76" height "38" rx="5" fill="#455a64" opacity="0.1"/>
  <!-- Serial/License plate -->
  <rect x="50" y="20" width="100" height="20" rx="4" fill="#212121"/>
  <text x="100" y="33" font-family="Arial" font-size="11" fill="#fff" text-anchor="middle">LICENSE: DSG-01</text>
  <!-- Upper band -->
  <rect x="50" y="140" width="100" height="16" fill="#efebe9"/>
  <!-- Lower band -->
  <rect x="50" y="210" width="100" height="18" fill="#e0e0e0"/>
  <!-- Label area -->
  <rect x="70" y="130" width "60" height="50" rx="6" fill="#fff" opacity="0.95"/>
  <text x="100" y="155" font-family="Arial" font-size="20" font-weight="bold" fill="#17365D" text-anchor="middle">15 KG</text>
  <text x="100" y="172" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">COMMERCIAL Cylinder</text>
  <!-- Bottom ring -->
  <rect x="50" y="270" width="100" height="16" rx="6" fill="url(#ring15)"/>
  <!-- Base -->
  <rect x="42" y="286" width="116" height="18" rx="8" fill="#455a64"/>
  <!-- Side reinforcement -->
  <rect x="158" y="100" width="18" height="110" rx="8" fill="#607d8b" opacity="0.3"/>
</svg>