<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 440" width="210" height="440">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8E1B1B"/>
      <stop offset="18%" stop-color="#C0392B"/>
      <stop offset="45%" stop-color="#D64545"/>
      <stop offset="68%" stop-color="#E8705F"/>
      <stop offset="86%" stop-color="#F1948A"/>
      <stop offset="100%" stop-color="#8E1B1B"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#641E16"/>
      <stop offset="50%" stop-color="#C0392B"/>
      <stop offset="100%" stop-color="#641E16"/>
    </linearGradient>
    <linearGradient id="valve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5D6D7E"/>
      <stop offset="50%" stop-color="#AEB6BF"/>
      <stop offset="100%" stop-color="#5D6D7E"/>
    </linearGradient>
    <radialGradient id="cap" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDFEFE"/>
      <stop offset="100%" stop-color="#BFC9CA"/>
    </radialGradient>
  </defs>

  <!-- Valve assembly -->
  <rect x="92.02" y="6" width="25.96" height="16" rx="4" fill="url(#valve)"/>
  <ellipse cx="105" cy="20" rx="16" ry="8" fill="url(#cap)" stroke="#444" stroke-width="1.4"/>
  <rect x="102.5" y="12" width="5" height="8" fill="#7F8C8D"/>

  <!-- Top ring -->
  <rect x="62.52" y="58" width="84.96" height="11" rx="6" fill="url(#ring)"/>

  <!-- Main cylinder body -->
  <rect x="46" y="65" width="118" height="348" rx="17" fill="url(#body)" stroke="#7B241C" stroke-width="2.4"/>

  <!-- Side highlights -->
  <rect x="54" y="82" width="8" height="309" rx="4" fill="#FFFFFF" opacity="0.28"/>
  <rect x="145" y="82" width="9" height="309" rx="4" fill="#8E1B1B" opacity="0.28"/>

  <!-- Gaspoint brand label -->
  <rect x="66" y="217" width="78" height="45" rx="8" fill="#FFFFFF" opacity="0.94" stroke="#7B241C" stroke-width="1.2"/>
  <text x="105" y="237" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#8E1B1B" text-anchor="middle">GASPOINT</text>
  <text x="105" y="253" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1C2833" text-anchor="middle">21 KG</text>
  <text x="105" y="265" font-family="Arial, Helvetica, sans-serif" font-size="7" fill="#566573" text-anchor="middle">COMMERCIAL CYLINDER</text>

  <!-- Bottom ring -->
  <rect x="62.52" y="406" width="84.96" height="11" rx="6" fill="url(#ring)"/>

  <!-- Base -->
  <rect x="41" y="416" width="127" height="13" rx="7" fill="#5D4037"/>
</svg>
