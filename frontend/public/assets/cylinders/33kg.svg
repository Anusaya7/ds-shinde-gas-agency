<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 500" width="240" height="500">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8E1B1B"/>
      <stop offset="18%" stop-color="#C0392B"/>
      <stop offset="45%" stop-color="#D64545"/>
      <stop offset="68%" stop-color="#E8705F"/>
      <stop offset="86%" stop-color="#F1948A"/>
      <stop offset="100%" stop-color="#8E1B1B"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#641E16"/>
      <stop offset="50%" stop-color="#C0392B"/>
      <stop offset="100%" stop-color="#641E16"/>
    </linearGradient>
    <linearGradient id="valve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5D6D7E"/>
      <stop offset="50%" stop-color="#AEB6BF"/>
      <stop offset="100%" stop-color="#5D6D7E"/>
    </linearGradient>
    <radialGradient id="cap" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDFEFE"/>
      <stop offset="100%" stop-color="#BFC9CA"/>
    </radialGradient>
  </defs>

  <!-- Valve assembly -->
  <rect x="105.7" y="6" width="28.6" height="18" rx="4" fill="url(#valve)"/>
  <ellipse cx="120" cy="22" rx="18" ry="9" fill="url(#cap)" stroke="#444" stroke-width="1.4"/>
  <rect x="117.5" y="13" width="5" height="9" fill="#7F8C8D"/>

  <!-- Top ring -->
  <rect x="73.2" y="66" width="93.6" height="12" rx="6" fill="url(#ring)"/>

  <!-- Main cylinder body -->
  <rect x="55" y="74" width="130" height="398" rx="19" fill="url(#body)" stroke="#7B241C" stroke-width="2.4"/>

  <!-- Side highlights -->
  <rect x="64" y="92" width="9" height="355" rx="4" fill="#FFFFFF" opacity="0.28"/>
  <rect x="164" y="92" width="10" height="355" rx="4" fill="#8E1B1B" opacity="0.28"/>

  <!-- Gaspoint brand label -->
  <rect x="77" y="248" width="86" height="49" rx="8" fill="#FFFFFF" opacity="0.94" stroke="#7B241C" stroke-width="1.2"/>
  <text x="120" y="270" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#8E1B1B" text-anchor="middle">GASPOINT</text>
  <text x="120" y="289" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1C2833" text-anchor="middle">33 KG</text>
  <text x="120" y="302" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#566573" text-anchor="middle">COMMERCIAL CYLINDER</text>

  <!-- Bottom ring -->
  <rect x="73.2" y="464" width="93.6" height="12" rx="6" fill="url(#ring)"/>

  <!-- Base -->
  <rect x="50" y="476" width="140" height="14" rx="7" fill="#5D4037"/>
</svg>
