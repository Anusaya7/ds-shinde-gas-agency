<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Gaspoint LPG cylinders and delivery truck">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A237E"/>
      <stop offset="1" stop-color="#D32F2F"/>
    </linearGradient>
    <linearGradient id="truck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e5e7eb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="24" fill="url(#bg)"/>

  <!-- Ground -->
  <rect y="470" width="800" height="130" fill="#00000033"/>

  <!-- Delivery truck -->
  <g>
    <rect x="470" y="300" width="220" height="130" rx="10" fill="url(#truck)"/>
    <rect x="470" y="300" width="220" height="26" rx="10" fill="#D32F2F"/>
    <text x="580" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#1A237E">Gaspoint</text>
    <text x="580" y="404" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2E7D32">जरुरत जीवन की...</text>
    <rect x="690" y="350" width="70" height="80" rx="8" fill="#ffffff"/>
    <rect x="700" y="360" width="46" height="46" rx="4" fill="#1A237E33"/>
    <circle cx="510" cy="440" r="24" fill="#111827"/>
    <circle cx="510" cy="440" r="10" fill="#9ca3af"/>
    <circle cx="660" cy="440" r="24" fill="#111827"/>
    <circle cx="660" cy="440" r="10" fill="#9ca3af"/>
  </g>

  <!-- 21 kg red cylinder -->
  <g>
    <rect x="120" y="180" width="110" height="290" rx="50" fill="#D32F2F"/>
    <rect x="120" y="180" width="110" height="290" rx="50" fill="url(#shade)" opacity="0"/>
    <rect x="145" y="150" width="60" height="40" rx="8" fill="#b71c1c"/>
    <circle cx="175" cy="150" r="14" fill="#9ca3af"/>
    <rect x="140" y="300" width="70" height="60" rx="6" fill="#ffffff"/>
    <text x="175" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#D32F2F">21 kg</text>
    <text x="175" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Gaspoint</text>
  </g>

  <!-- 19.2 kg green cylinder -->
  <g>
    <rect x="280" y="210" width="100" height="260" rx="46" fill="#2E7D32"/>
    <rect x="302" y="184" width="56" height="36" rx="8" fill="#1b5e20"/>
    <circle cx="330" cy="184" r="12" fill="#9ca3af"/>
    <rect x="297" y="320" width="66" height="56" rx="6" fill="#ffffff"/>
    <text x="330" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2E7D32">19.2 kg</text>
    <text x="330" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Gaspoint</text>
  </g>

  <!-- Flame badge -->
  <g>
    <circle cx="700" cy="150" r="42" fill="#ffffff22"/>
    <path d="M700 118 c 14 18 26 28 26 44 a26 26 0 0 1 -52 0 c 0 -16 12 -26 26 -44 z" fill="#FFC107"/>
    <path d="M700 138 c 8 11 14 16 14 25 a14 14 0 0 1 -28 0 c 0 -9 6 -14 14 -25 z" fill="#D32F2F"/>
  </g>
</svg>
