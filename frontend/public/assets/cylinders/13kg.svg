<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 340" width="200" height="340">
  <defs>
    <linearGradient id="body13" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9c9c9"/>
      <stop offset="30%" style="stop-color:#e8e8e8"/>
      <stop offset="50%" style="stop-color:#f5f5f5"/>
      <stop offset="70%" style="stop-color:#e0e0e0"/>
      <stop offset="100%" style="stop-color:#a8a8a8"/>
    </linearGradient>
    <linearGradient id="ring13" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#555"/>
      <stop offset="50%" style="stop-color:#999"/>
      <stop offset="100%" style="stop-color:#555"/>
    </linearGradient>
    <radialGradient id="cap13" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff"/>
      <stop offset="100%" style="stop-color:#ccc"/>
    </radialGradient>
  </defs>
  <!-- Top cap/valve assembly -->
  <ellipse cx="100" cy="28" rx="30" ry="8" fill="url(#cap13)" stroke="#444" stroke-width="1.5"/>
  <rect x="85" y="20" width="30" height="18" rx="4" fill="#2c3e50"/>
  <circle cx="100" cy="28" r="8" fill="#1a1a2e" stroke="#000" stroke-width="1"/>
  <!-- Top ring collar -->
  <rect x="55" y="38" width="90" height="12" rx="3" fill="url(#ring13)"/>
  <!-- Cylinder body -->
  <rect x="45" y="50" width="110" height="160" rx="10" fill="url(#body13)" stroke="#888" stroke-width="2"/>
  <!-- Body highlights -->
  <rect x="55" y="58" width="12" height="148" rx="6" fill="#fff" opacity="0.3"/>
  <rect x="133" y="58" width="10" height="148" rx="5" fill="#444" opacity="0.15"/>
  <!-- Safety valve area -->
  <rect x="45" y="80" width="110" height="18" fill="#e8e8e8" opacity="0.5"/>
  <text x="100" y="92" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">SAFETY VALVE</text>
  <!-- Middle identification band -->
  <rect x="45" y="130" width="110" height="20" fill="#d0d0d0"/>
  <!-- Label area -->
  <rect x="65" y="110" width="70" height="50" rx="6" fill="#fff" opacity="0.95"/>
  <text x="100" y="135" font-family="Arial" font-size="18" font-weight="bold" fill="#17365D" text-anchor="middle">13 KG</text>
  <text x="100" y="150" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">DOMESTIC LPG</text>
  <!-- Bottom ring -->
  <rect x="45" y="210" width="110" height="14" rx="4" fill="url(#ring13)"/>
  <!-- Base foot -->
  <rect x="38" y="224" width="124" height="16" rx="5" fill="#3a3a3a"/>
  <!-- Handle guard on side -->
  <rect x="160" y="90" width="16" height="80" rx="6" fill="#555"/>
  <rect x="168" y="80" width="32" height="18" rx="6" fill="#555"/>
  <!-- Foot ring detail -->
  <rect x="40" y="240" width="120" height="8" rx="2" fill="#2a2a2a"/>
</svg>