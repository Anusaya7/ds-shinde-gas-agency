<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 780" width="320" height="780">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8E1B1B"/>
      <stop offset="18%" stop-color="#C0392B"/>
      <stop offset="45%" stop-color="#D64545"/>
      <stop offset="68%" stop-color="#E8705F"/>
      <stop offset="86%" stop-color="#F1948A"/>
      <stop offset="100%" stop-color="#8E1B1B"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#641E16"/>
      <stop offset="50%" stop-color="#C0392B"/>
      <stop offset="100%" stop-color="#641E16"/>
    </linearGradient>
    <linearGradient id="valve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5D6D7E"/>
      <stop offset="50%" stop-color="#AEB6BF"/>
      <stop offset="100%" stop-color="#5D6D7E"/>
    </linearGradient>
    <radialGradient id="cap" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDFEFE"/>
      <stop offset="100%" stop-color="#BFC9CA"/>
    </radialGradient>
  </defs>

  <!-- Valve assembly -->
  <rect x="140.2" y="6" width="39.6" height="25" rx="4" fill="url(#valve)"/>
  <ellipse cx="160" cy="31" rx="25" ry="13" fill="url(#cap)" stroke="#444" stroke-width="1.4"/>
  <rect x="157.5" y="18" width="5" height="13" fill="#7F8C8D"/>

  <!-- Top ring -->
  <rect x="95.2" y="90" width="129.6" height="16" rx="6" fill="url(#ring)"/>

  <!-- Main cylinder body -->
  <rect x="70" y="101" width="180" height="638" rx="26" fill="url(#body)" stroke="#7B241C" stroke-width="2.4"/>

  <!-- Side highlights -->
  <rect x="83" y="126" width="13" height="579" rx="4" fill="#FFFFFF" opacity="0.28"/>
  <rect x="221" y="126" width="14" height="579" rx="4" fill="#8E1B1B" opacity="0.28"/>

  <!-- Gaspoint brand label -->
  <rect x="101" y="386" width="119" height="68" rx="8" fill="#FFFFFF" opacity="0.94" stroke="#7B241C" stroke-width="1.2"/>
  <text x="160" y="416" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="bold" fill="#8E1B1B" text-anchor="middle">GASPOINT</text>
  <text x="160" y="442" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1C2833" text-anchor="middle">425 KG</text>
  <text x="160" y="460" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#566573" text-anchor="middle">BULK LOT INSTALLATION</text>

  <!-- Bottom ring -->
  <rect x="95.2" y="728" width="129.6" height="16" rx="6" fill="url(#ring)"/>

  <!-- Base -->
  <rect x="63" y="745" width="194" height="20" rx="7" fill="#5D4037"/>
</svg>
