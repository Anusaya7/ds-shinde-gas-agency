<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 540" width="240" height="540">
  <defs>
    <linearGradient id="body50" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6d4c41"/>
      <stop offset="30%" style="stop-color:#795548"/>
      <stop offset="60%" style="stop-color:#8d6e63"/>
      <stop offset="100%" style="stop-color:#a1887f"/>
    </linearGradient>
    <linearGradient id="ring50" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3e2723"/>
      <stop offset="50%" style="stop-color:#5d4037"/>
      <stop offset="100%" style="stop-color:#3e2723"/>
    </linearGradient>
  </defs>
  <!-- Industrial valve -->
  <rect x="90" y="14" width="60" height="28" rx="7" fill="#4e342e"/>
  <circle cx="120" cy="34" r="6" fill="#212121" stroke="#4e342e" stroke-width="1"/>
  <text x="120" y="41" font-family="Arial" font-size="8" fill="#fff" text-anchor="middle">IND VALVE</text>
  <!-- Top industrial ring -->
  <rect x="50" y="52" width="140" height="16" rx="5" fill="url(#ring50)"/>
  <!-- Main body -->
  <rect x="50" y="68" width="140" height="380" rx="20" fill="url(#body50)" stroke="#795548" stroke-width="3"/>
  <!-- Side accents -->
  <rect x="60" y="80" width="10" height="366" rx="5" fill="#fff" opacity="0.15"/>
  <rect x="170" y="80" width="10" height="366" rx="5" fill="#5d4037" opacity="0.12"/>
  <!-- Industrial banding pattern -->
  <rect x="50" y="148" width="140" height="28" fill="#8d6e63" opacity="0.4"/>
  <rect x="50" y="208" width="140" height="28" fill="#a1887f" opacity="0.5"/>
  <rect x="50" y="268" width="140" height="28" fill="#bcaaa4" opacity="0.6"/>
  <rect x="50" y="328" width="140" height="28" fill="#8d6e63" opacity="0.4"/>
  <!-- Label plate -->
  <rect x="90" y="288" width="60" height="50" rx="6" fill="#fff" opacity="0.93"/>
  <text x="120" y="320" font-family="Arial" font-size="22" font-weight="bold" fill="#17365D" text-anchor="middle">50 KG</text>
  <text x="120" y="338" font-family="Arial" font-size="10" fill="#666" text-anchor="middle">HEAVY DUTY</text>
  <!-- Base assembly -->
  <rect x="30" y="448" width="180" height="24" rx="8" fill="#4e342e"/>
  <rect x="20" y="470" width="200" height="16" rx="6" fill="#2e1b17"/>
  <!-- Bottom ring -->
  <rect x="50" y="486" width="140" height="16" rx="8" fill="url(#ring50)"/>
  <!-- Reinforcement ribs -->
  <rect x="200" y="108" width="20" height="300" rx="6" fill="#6d4c41" opacity="0.2"/>
  <!-- Serial tag -->
  <text x="120" y="525" font-family="Arial" font-size="8" fill="#9e9e9e" text-anchor="middle">S/N: DS-IND-50</text>
</svg>