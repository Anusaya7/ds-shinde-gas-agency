<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 390" width="200" height="390">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8E1B1B"/>
      <stop offset="18%" stop-color="#C0392B"/>
      <stop offset="45%" stop-color="#D64545"/>
      <stop offset="68%" stop-color="#E8705F"/>
      <stop offset="86%" stop-color="#F1948A"/>
      <stop offset="100%" stop-color="#8E1B1B"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#641E16"/>
      <stop offset="50%" stop-color="#C0392B"/>
      <stop offset="100%" stop-color="#641E16"/>
    </linearGradient>
    <linearGradient id="valve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5D6D7E"/>
      <stop offset="50%" stop-color="#AEB6BF"/>
      <stop offset="100%" stop-color="#5D6D7E"/>
    </linearGradient>
    <radialGradient id="cap" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDFEFE"/>
      <stop offset="100%" stop-color="#BFC9CA"/>
    </radialGradient>
  </defs>

  <!-- Valve assembly -->
  <rect x="89" y="6" width="22" height="15" rx="4" fill="url(#valve)"/>
  <ellipse cx="100" cy="18" rx="14" ry="7" fill="url(#cap)" stroke="#444" stroke-width="1.4"/>
  <rect x="97.5" y="10" width="5" height="7" fill="#7F8C8D"/>

  <!-- Top ring -->
  <rect x="64" y="52" width="72" height="9" rx="6" fill="url(#ring)"/>

  <!-- Main cylinder body -->
  <rect x="50" y="58" width="100" height="306" rx="15" fill="url(#body)" stroke="#7B241C" stroke-width="2.4"/>

  <!-- Side highlights -->
  <rect x="57" y="72" width="7" height="273" rx="4" fill="#FFFFFF" opacity="0.28"/>
  <rect x="134" y="72" width="8" height="273" rx="4" fill="#8E1B1B" opacity="0.28"/>

  <!-- Gaspoint brand label -->
  <rect x="67" y="192" width="66" height="38" rx="8" fill="#FFFFFF" opacity="0.94" stroke="#7B241C" stroke-width="1.2"/>
  <text x="100" y="209" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#8E1B1B" text-anchor="middle">GASPOINT</text>
  <text x="100" y="223" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1C2833" text-anchor="middle">17 KG</text>
  <text x="100" y="233" font-family="Arial, Helvetica, sans-serif" font-size="6" fill="#566573" text-anchor="middle">DOMESTIC LPG CYLINDER</text>

  <!-- Bottom ring -->
  <rect x="64" y="358" width="72" height="9" rx="6" fill="url(#ring)"/>

  <!-- Base -->
  <rect x="46" y="367" width="108" height="11" rx="7" fill="#5D4037"/>
</svg>
