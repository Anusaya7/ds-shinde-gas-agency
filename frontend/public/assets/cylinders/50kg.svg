<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 560" width="260" height="560">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8E1B1B"/>
      <stop offset="18%" stop-color="#C0392B"/>
      <stop offset="45%" stop-color="#D64545"/>
      <stop offset="68%" stop-color="#E8705F"/>
      <stop offset="86%" stop-color="#F1948A"/>
      <stop offset="100%" stop-color="#8E1B1B"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#641E16"/>
      <stop offset="50%" stop-color="#C0392B"/>
      <stop offset="100%" stop-color="#641E16"/>
    </linearGradient>
    <linearGradient id="valve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5D6D7E"/>
      <stop offset="50%" stop-color="#AEB6BF"/>
      <stop offset="100%" stop-color="#5D6D7E"/>
    </linearGradient>
    <radialGradient id="cap" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDFEFE"/>
      <stop offset="100%" stop-color="#BFC9CA"/>
    </radialGradient>
  </defs>

  <!-- Valve assembly -->
  <rect x="114.16" y="6" width="31.68" height="21" rx="4" fill="url(#valve)"/>
  <ellipse cx="130" cy="25" rx="20" ry="10" fill="url(#cap)" stroke="#444" stroke-width="1.4"/>
  <rect x="127.5" y="15" width="5" height="10" fill="#7F8C8D"/>

  <!-- Top ring -->
  <rect x="78.16" y="74" width="103.67999999999999" height="13" rx="6" fill="url(#ring)"/>

  <!-- Main cylinder body -->
  <rect x="58" y="83" width="144" height="449" rx="21" fill="url(#body)" stroke="#7B241C" stroke-width="2.4"/>

  <!-- Side highlights -->
  <rect x="68" y="103" width="10" height="401" rx="4" fill="#FFFFFF" opacity="0.28"/>
  <rect x="179" y="103" width="12" height="401" rx="4" fill="#8E1B1B" opacity="0.28"/>

  <!-- Gaspoint brand label -->
  <rect x="82" y="280" width="95" height="55" rx="8" fill="#FFFFFF" opacity="0.94" stroke="#7B241C" stroke-width="1.2"/>
  <text x="130" y="304" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#8E1B1B" text-anchor="middle">GASPOINT</text>
  <text x="130" y="324" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1C2833" text-anchor="middle">50 KG</text>
  <text x="130" y="339" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#566573" text-anchor="middle">INDUSTRIAL CYLINDER</text>

  <!-- Bottom ring -->
  <rect x="78.16" y="523" width="103.67999999999999" height="13" rx="6" fill="url(#ring)"/>

  <!-- Base -->
  <rect x="52" y="536" width="156" height="16" rx="7" fill="#5D4037"/>
</svg>
